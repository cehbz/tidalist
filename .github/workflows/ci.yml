name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # 'integration' hits Tidal/MusicBrainz/Discogs; excluded per pyproject marker.
      - run: uv run pytest -q -m 'not integration'
